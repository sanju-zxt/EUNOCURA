# DigitalOcean App Platform spec — region BLR1 (Bangalore).
#
#   doctl apps create --spec .do/app.yaml
#
# Two components, because the frontend is a Vite build and its API URL is fixed
# at build time:
#
#   api  — the FastAPI container (backend/Dockerfile)
#   web  — the React static site, built with VITE_API_BASE_URL bound to the api's
#          public URL, so no CORS guessing and no hardcoded localhost.
#
# REPLACE the github block below with your own fork. A submission that points at
# someone else's repo cannot be built from, and the handbook is explicit that
# lifting the public repo is not a submission.
name: eunocura
region: blr1

services:
  - name: api
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    github:
      repo: sanju-zxt/EUNOCURA
      branch: main
      deploy_on_push: true
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /healthz
      initial_delay_seconds: 20
      period_seconds: 30
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      # No Ollama server inside the container, so the cloud Gemma path is used.
      # Gemma is open weights; the API is only transport.
      - key: LLM_PROVIDER
        value: gemini
        scope: RUN_TIME
      - key: GEMINI_MODEL
        value: gemma-4-26b-a4b-it
        scope: RUN_TIME
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      # Atlas connection string, e.g. mongodb+srv://user:pass@cluster/InterIIIT
      - key: MONGODB_URI
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: SECRET_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: LLM_CACHE_ENABLED
        value: "1"
        scope: RUN_TIME
      - key: FRONTEND_ORIGINS
        value: ${web.PUBLIC_URL}
        scope: RUN_TIME

static_sites:
  - name: web
    source_dir: frontend
    github:
      repo: REPLACE_WITH_YOUR_FORK/eunocura
      branch: main
      deploy_on_push: true
    build_command: npm ci && npm run build
    output_dir: dist
    index_document: index.html
    # Client-side routes must not 404 on refresh.
    catchall_document: index.html
    envs:
      - key: VITE_API_BASE_URL
        value: ${api.PUBLIC_URL}
        scope: BUILD_TIME
