name: CI

# The gate for EUNOCURA: nothing ships unless the API boots with the frozen
# contract mounted, the offline suites pass, and no key material is in src.
# Deploy is not here on purpose — DigitalOcean and Vercel build from their own
# git integrations.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install requirements
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile, run the suites, boot the app, scan for secrets
        working-directory: backend
        run: python scripts/ci_checks.py

  frontend:
    name: frontend (node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # No `cache: npm` here: it needs a committed package-lock.json as its
          # cache key, and frontend/.gitignore ignores that file on purpose. npm
          # then failed setup-node outright ("Some specified paths were not
          # resolved, unable to cache dependencies") before a single line ran.

      - name: Install
        working-directory: frontend
        # `npm install`, not `npm ci` - same reason: ci refuses to run without a
        # lockfile.
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Assert the build produced an app
        working-directory: frontend
        run: |
          set -euo pipefail
          test -f dist/index.html
          echo "dist/index.html present ($(wc -c < dist/index.html) bytes)"
          du -sh dist

  # Dispatch only. The image is the deployment artifact, so it is worth
  # proving it builds, but not on every PR — that is minutes nobody needs.
  docker:
    name: docker image (dispatch only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the API image
        run: docker build --tag eunocura-api:ci --file backend/Dockerfile backend

      - name: Assert the image starts
        run: |
          set -euo pipefail
          docker run --detach --name api --publish 8000:8000 eunocura-api:ci
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/healthz > /dev/null; then
              echo "/healthz answered after ${attempt}s"
              curl --silent http://127.0.0.1:8000/healthz | head -c 400
              echo
              docker rm --force api > /dev/null
              exit 0
            fi
            sleep 1
          done
          echo "the container never answered on /healthz"
          docker logs api
          docker rm --force api > /dev/null
          exit 1
